# Keep-alive de Sky Shop (07-18, D-36).
#
# Que hace: pide GET /health del backend en Render cada 10 minutos para que no se duerma y los clientes no
# esperen ~1 minuto de arranque en frio.
#
# Por que solo en horario de tienda: Render gratuito da 750 horas al mes por workspace; mantener el servicio
# despierto las 24 horas las agotaria. El horario es de 7:00 a 22:00 en Venezuela (UTC-4), o sea 11:00 a 02:00 UTC.
# Las tres lineas de cron cubren ese tramo (que cruza la medianoche UTC): 11-23 UTC, 0-1 UTC y las 02:00 UTC.
#
# Por que /health y no la API: /health no toca la base de datos, asi Neon puede escalar a cero y no gasta CU-h.
#
# Sin secretos: la URL de /health es publica y vive en la variable del repositorio RENDER_HEALTH_URL
# (Settings -> Secrets and variables -> Actions -> Variables). Si la variable no existe el trabajo termina bien con un aviso.
#
# Limites de GitHub: los trabajos programados pueden retrasarse o saltarse en horas de mucha carga, y GitHub pausa los
# workflows programados de un repositorio publico tras 60 dias sin actividad (hay que reactivarlo a mano en la pestana Actions).
# Cada trabajo se redondea a 1 minuto; en un repositorio publico los minutos son gratis (decision de Miguel: repositorio
# publico aparte que solo contiene este archivo).
name: keep-alive

on:
  schedule:
    - cron: "*/10 11-23 * * *"
    - cron: "*/10 0-1 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Pedir /health al backend
        env:
          RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$RENDER_HEALTH_URL" ]; then
            echo "::warning::La variable RENDER_HEALTH_URL no existe; no hay nada que pedir."
            exit 0
          fi
          # 90 s: Render tarda cerca de un minuto en despertar tras dormirse.
          curl -fsS --max-time 90 "$RENDER_HEALTH_URL"
