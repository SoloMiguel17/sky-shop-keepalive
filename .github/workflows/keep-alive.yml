name: keep-alive

on:
  schedule:
    - cron: "*/10 11-23 * * *"
    - cron: "*/10 0-1 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Pedir /health al backend
        env:
          RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$RENDER_HEALTH_URL" ]; then
            echo "::warning::La variable RENDER_HEALTH_URL no existe; no hay nada que pedir."
            exit 0
          fi
          curl -fsS --max-time 90 "$RENDER_HEALTH_URL"
